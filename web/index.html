<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoQ Live Caption Translation</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --good: #3fb950;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      header {
        padding: 20px 28px;
        border-bottom: 1px solid var(--border);
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      header p { margin: 0; color: var(--muted); font-size: 14px; }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
        padding: 18px 28px;
        border-bottom: 1px solid var(--border);
      }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      input, select, button {
        font-size: 14px;
        padding: 8px 10px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      input { min-width: 240px; }
      button {
        cursor: pointer;
        background: var(--accent);
        color: #04101f;
        border-color: var(--accent);
        font-weight: 600;
      }
      button:disabled { opacity: .5; cursor: default; }
      #status {
        margin-left: auto;
        font-size: 13px;
        color: var(--muted);
      }
      #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
      #status.connected .dot { background: var(--good); }
      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        min-height: 60vh;
      }
      .panel { background: var(--bg); display: flex; flex-direction: column; }
      .panel h2 {
        margin: 0;
        padding: 12px 20px;
        font-size: 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel h2 .path { color: var(--muted); font-weight: 400; font-size: 12px; font-family: ui-monospace, monospace; }
      .lang-select { padding: 4px 8px; font-size: 14px; font-weight: 600; }
      .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
      .lat { margin-left: auto; font-size: 12px; font-family: ui-monospace, monospace; color: var(--muted); }
      .cue .lat-badge { margin-left: 8px; font-size: 11px; font-family: ui-monospace, monospace; }
      .cue .llm-badge { color: var(--accent); }
      .lat-good { color: var(--good); }
      .lat-ok { color: #d29922; }
      .lat-slow { color: #f85149; }
      .feed { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
      .cue { animation: fade .3s ease; }
      .cue .seq { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; margin-right: 8px; }
      .cue.latest { color: var(--accent); }
      .hint { color: var(--muted); font-style: italic; }
      @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <header>
      <h1>MoQ Live Caption Translation</h1>
      <p>English captions stream over Media&nbsp;over&nbsp;QUIC. Pick a language to send an
        <strong>intent to receive</strong> &mdash; that subscription is what triggers on-demand LLM translation.
        &nbsp;<a href="video.html" style="color:#58a6ff">video&nbsp;+&nbsp;WebVTT demo&nbsp;&rarr;</a></p>
    </header>

    <div class="controls">
      <div class="field">
        <label for="relay">Relay</label>
        <input id="relay" value="https://cdn.moq.pro/pk54jf2kv65wn" />
      </div>
      <div class="field">
        <label for="jwk">Signing key (JWK)</label>
        <span style="display:flex; gap:6px; align-items:center">
          <input type="password" id="jwk" autocomplete="off"
                 placeholder="paste JWK — stored in this browser only" style="min-width:220px" />
          <button type="button" id="jwk-show" title="Show / hide the key"
                  style="padding:4px 10px; font-size:12px; cursor:pointer">show</button>
        </span>
      </div>
      <div class="field">
        <label for="video">Video id</label>
        <input id="video" value="live1" style="min-width: 120px" />
      </div>
      <button id="connect">Connect</button>
      <div id="status"><span class="dot"></span><span class="txt">disconnected</span></div>
    </div>

    <div class="panels">
      <div class="panel">
        <h2>
          <span class="lbl">Source</span>
          <select class="lang-select" id="left-lang" data-default="en"></select>
          <span class="path" id="left-path"></span>
          <span class="lat" id="left-lat"></span>
        </h2>
        <div class="feed" id="left-feed"><div class="hint">Connect to start streaming.</div></div>
      </div>
      <div class="panel">
        <h2>
          <span class="lbl">Translate to</span>
          <select class="lang-select" id="right-lang" data-default="tr"></select>
          <span class="path" id="right-path"></span>
          <span class="lat" id="right-lat"></span>
        </h2>
        <div class="feed" id="right-feed"><div class="hint">Pick a language.</div></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
