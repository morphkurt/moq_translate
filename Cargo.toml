[package]
name = "moq-translate"
version = "0.1.0"
edition = "2021"

[dependencies]
# MoQ stack, pinned to the moq-dev/moq monorepo revision we developed against.
moq-net = { git = "https://github.com/moq-dev/moq", rev = "50313f2b290cc12a44ff91472a39de2362974c6a" }
moq-tokio = { git = "https://github.com/moq-dev/moq", rev = "50313f2b290cc12a44ff91472a39de2362974c6a" }
moq-json = { git = "https://github.com/moq-dev/moq", rev = "50313f2b290cc12a44ff91472a39de2362974c6a" }
moq-auth = { git = "https://github.com/moq-dev/moq", rev = "50313f2b290cc12a44ff91472a39de2362974c6a" }
moq-pattern = { git = "https://github.com/moq-dev/moq", rev = "50313f2b290cc12a44ff91472a39de2362974c6a" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
url = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "publish"
path = "src/bin/publish.rs"

[[bin]]
name = "translate"
path = "src/bin/translate.rs"

[[bin]]
name = "subscribe"
path = "src/bin/subscribe.rs"

[[bin]]
name = "token"
path = "src/bin/token.rs"
